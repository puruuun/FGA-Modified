# cargo-deny configuration, checked by .github/workflows/native-ci.yml.

[graph]
# The app ships only these, and CI tests on Linux; Windows-only crates are not part of what ships.
targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only (docs/agents/rust-native.md). Anything not listed, including every
# GPL, AGPL and LGPL variant, is rejected.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # The Mozilla CA bundle (webpki-root-certs) that the `ort` feature's build script uses to
    # check the TLS certificate of the ONNX Runtime download. Data only, nothing of it ships.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
