# The PP-OCRv6 recogniser that every build carrying the Rust engine packages (issue #568, design
# 0026). The model is never committed; Gradle (`provideOcrModel` in app/build.gradle.kts) takes it
# from -Pfga.ocr.model=<path> or downloads `url`, and refuses it unless both `size` and `sha256`
# match. The APK carries this file next to the model, and the app checks its copy of the model
# against the same two values.
#
# Change url, sha256 and size together, and only for a model the support-score reader has been
# measured with (docs/agents/rust-native.md, "Rust test APK"). Its notice, NOTICE.txt, is part of
# native/THIRD_PARTY_NOTICES.txt; run tools/ci/native_notices.py generate after changing it.
#
# Source: RapidOCR's model listing (python/rapidocr/default_models.yaml, entry
# multi_PP-OCRv6_rec_small) names this URL and SHA-256; ModelScope serves the file with the same
# SHA-256 as its X-Linked-Etag.
file=PP-OCRv6_rec_small.onnx
url=https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.10.0/onnx/PP-OCRv6/rec/PP-OCRv6_rec_small.onnx
sha256=6f327246b50388f3c176ae304bd95767ea6dc0c9ae92153ef8cbe210b3c14884
size=21234383
