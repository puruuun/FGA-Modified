[package]
name = "fga-ffi"
version = "0.1.0"
description = "The Kotlin boundary of the FGA Rust core"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "fga_ffi"
# cdylib for the APK, rlib so `cargo test` can link the probes on the host.
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
jni = "0.21.1"

# ring and tract compile C or assembly, so every host that builds this crate needs a C compiler;
# Android cross-builds use the NDK's clang.
ring = "0.17.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tract-core = "0.23"
# Issue #530 measures the PP-OCRv6 recogniser on devices. tract is the pure-Rust backend, so the
# Android build gains no prebuilt runtime.
# The version keeps cargo-deny's wildcard ban satisfied for a path dependency.
fga-sensing = { path = "../fga-sensing", version = "0.1.0", features = ["tract"] }

[features]
default = []
# Exists only for tests/ocr_poisoned.rs: a function that poisons the OCR recogniser lock. The
# self dev-dependency below turns it on for test builds only; the feature resolver keeps it out
# of `cargo build`, the cargo-ndk build and Gradle's cargoNdkBuild.
test-hooks = []
# Issue #535: the ONNX Runtime probes next to the tract ones. Off by default, so the plain
# cargo-ndk build and Gradle's `-Pfga.native=true` build exactly what they built before; Gradle
# turns it on with `-Pfga.native.ort=true`. For Android, ort-sys links the libonnxruntime.so of
# Microsoft's onnxruntime-android AAR, which Gradle extracts and passes in through ORT_LIB_PATH
# (docs/agents/rust-native.md); on the PC it uses the prebuilt runtime that `ort` downloads.
ort-probe = ["fga-sensing/ort"]

[dev-dependencies]
# Tests only: the JSON shape checks and the model test on local samples.
png = "0.18"
serde_json = "1"
# The version keeps cargo-deny's wildcard ban satisfied for a path dependency.
fga-ffi = { path = ".", version = "0.1.0", features = ["test-hooks"] }
