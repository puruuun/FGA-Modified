name: Manual Build

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - 'mkdocs.yml'
      - 'tools/docs-site/**'
      - '.github/workflows/docs-check.yml'
  pull_request:
    paths:
      - 'wiki/**'
      - 'mkdocs.yml'
      - 'tools/docs-site/**'
      - '.github/workflows/docs-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: pip install -r tools/docs-site/requirements.txt

      - name: Build manual
        run: mkdocs build --strict
