name: Main CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC"'

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether the change needs the build
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          # Any failure must end in code=true: an error never skips the build.
          code=true
          list="$RUNNER_TEMP/changed-files"
          range=""
          case "$EVENT_NAME" in
            pull_request) [ -n "$PR_BASE" ] && [ -n "$PR_HEAD" ] && range="$PR_BASE...$PR_HEAD" ;;
            push)
              case "$PUSH_BEFORE" in
                ''|*[!0-9a-f]*|0000000000000000000000000000000000000000) ;;
                *) range="$PUSH_BEFORE..$PUSH_AFTER" ;;
              esac ;;
          esac
          if [ -n "$range" ]; then
            # --no-renames lists both the old and the new path of a rename.
            if git diff --name-only --no-renames -z "$range" > "$list" 2> "$RUNNER_TEMP/diff-err"; then
              code=$(python3 tools/ci/ci_gate.py classify < "$list") || code=true
            else
              echo "git diff failed for $range; building."
              cat "$RUNNER_TEMP/diff-err"
            fi
          else
            echo "No usable diff range for $EVENT_NAME; building."
          fi
          [ "$code" = false ] || code=true
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test-and-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Run unit tests
        run: ./gradlew :app:testCiUnitTest :prefs:testCiUnitTest :scripts:test :libautomata:test
      - name: Build CI APK
        run: ./gradlew :app:assembleCi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: main-ci-test-reports
          path: '**/build/test-results/**/*.xml'
          retention-days: 14

  gate:
    name: Main CI gate
    needs: [changes, test-and-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Evaluate the results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          BUILD_RESULT: ${{ needs.test-and-build.result }}
        run: python3 tools/ci/ci_gate.py gate "$CHANGES_RESULT" "$CODE" "$BUILD_RESULT"
