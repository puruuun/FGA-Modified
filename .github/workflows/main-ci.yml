name: Main CI

on:
  push:
    # Main dropped its push run (a fast-forward of an already checked commit tests the same tree again).
    # rust keeps one until the owner decides otherwise: rust is the long-lived branch of design 0025
    # (docs/agents/agent-team.md, "Branches and releases").
    branches: [rust]
  pull_request:
    # rust is the long-lived branch of design 0025; a PR into it gets the same gate as one into main.
    branches: [main, rust]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC"'

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      native: ${{ steps.classify.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the CI scripts
        # Before any script is used: a broken script must fail the gate, not misclassify.
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'
      - name: Decide whether the change needs the build
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          # Any failure must end in code=true and native=true: an error never skips a check.
          code=true
          native=true
          list="$RUNNER_TEMP/changed-files"
          range=""
          case "$EVENT_NAME" in
            pull_request) [ -n "$PR_BASE" ] && [ -n "$PR_HEAD" ] && range="$PR_BASE...$PR_HEAD" ;;
            push)
              case "$PUSH_BEFORE" in
                ''|*[!0-9a-f]*|0000000000000000000000000000000000000000) ;;
                *) range="$PUSH_BEFORE..$PUSH_AFTER" ;;
              esac ;;
          esac
          if [ -n "$range" ]; then
            # --no-renames lists both the old and the new path of a rename.
            if git diff --name-only --no-renames -z "$range" > "$list" 2> "$RUNNER_TEMP/diff-err"; then
              code=$(python3 tools/ci/ci_gate.py classify < "$list") || code=true
              native=$(python3 tools/ci/ci_gate.py classify-native < "$list") || native=true
            else
              echo "git diff failed for $range; building."
              cat "$RUNNER_TEMP/diff-err"
            fi
          else
            echo "No usable diff range for $EVENT_NAME; building."
          fi
          [ "$code" = false ] || code=true
          [ "$native" = false ] || native=true
          echo "code=$code native=$native"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "native=$native" >> "$GITHUB_OUTPUT"
          # The guard below checks the same range.
          echo "range=$range" >> "$GITHUB_OUTPUT"
      - name: Refuse model files, large files and build output
        env:
          RANGE: ${{ steps.classify.outputs.range }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: sh tools/ci/run_repo_guard.sh

  test-and-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Run unit tests
        run: ./gradlew :app:testCiUnitTest :prefs:testCiUnitTest :scripts:test :libautomata:test
      - name: Build CI APK
        run: ./gradlew :app:assembleCi
      - name: The APK holds no Rust library
        # Design 0026, D-6: the ci build type without -Pfga.native=true does not carry the engine
        # (beta and rust do, and so does the stable ci APK built with -Pfga.native=true; engine-apk.yml
        # builds and checks a beta APK with it).
        run: |
          set -eu
          set -- app/build/outputs/apk/ci/*.apk
          [ -e "$1" ] || { echo "No CI APK under app/build/outputs/apk/ci"; exit 1; }
          python3 tools/ci/apk_check.py absent "$@"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: main-ci-test-reports
          path: '**/build/test-results/**/*.xml'
          retention-days: 14

  # The Rust checks (native-ci.yml) and the engine APK (engine-apk.yml) are defined once, in their own
  # workflows. They are part of the required check because neither can be required on its own: a PR
  # that needs neither would never get a run of it. The engine APK runs for every code change, the
  # Rust checks only for the Rust paths (ci_gate.py, NATIVE_PATTERNS).
  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/native-ci.yml

  engine-apk:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/engine-apk.yml

  gate:
    name: Main CI gate
    needs: [changes, test-and-build, native, engine-apk]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Evaluate the results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          NATIVE: ${{ needs.changes.outputs.native }}
          BUILD_RESULT: ${{ needs.test-and-build.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          ENGINE_RESULT: ${{ needs.engine-apk.result }}
        run: python3 tools/ci/ci_gate.py gate "$CHANGES_RESULT" "$CODE" "$NATIVE" "$BUILD_RESULT" "$NATIVE_RESULT" "$ENGINE_RESULT"
