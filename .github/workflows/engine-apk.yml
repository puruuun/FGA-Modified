name: Engine APK

# Design 0026, D-8: a beta APK built the way a release is, with the engine, and checked as shipped.
# The owner's decision: it runs for every change that is not documentation only, the same rule as
# Main CI's build (ci_gate.py classify), since any Kotlin or resource change can change what the
# engine variant packages or what R8 keeps. The push paths below are that rule written as a filter:
# everything, minus DOC_PATTERNS, plus NATIVE_PATTERNS, which are never documentation
# (test_ci_workflows.py compares them with ci_gate.py).
#
# Pull requests do not trigger this workflow directly: Main CI calls it (workflow_call), so the job
# is part of the required check "Main CI gate".
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!.idea/**'
      - '!.github/instructions/**'
      - '!.github/copilot-instructions.md'
      - '!.gitattributes'
      - '!.gitignore'
      - '!*.md'
      - '!LICENSE'
      - '!custom-game-area/**'
      - '!wiki/**'
      - '!docs/**'
      - '!.claude/**'
      - '!**/AGENTS.md'
      - 'native/**'
      - '.github/workflows/native-ci.yml'
      - '.github/workflows/main-ci.yml'
      - 'tools/ci/native_notices.py'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # As in native-ci.yml: in a called run these are the caller's, so a manual or push run cannot
  # cancel the job of a pull request, and the group never equals Main CI's own.
  group: engine-apk-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # native-ci.yml pins the same version; change both together.
  CARGO_NDK_VERSION: 4.1.2

jobs:
  engine-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Read the pinned NDK
        # native/ndk-version.txt is the one place that names the NDK of the APK build.
        id: ndk
        run: |
          set -eu
          version=$(grep -v '^#' native/ndk-version.txt | tr -d ' \r' | grep -v '^$')
          echo "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'
          dir="$ANDROID_HOME/ndk/$version"
          preinstalled=false
          [ -f "$dir/source.properties" ] && preinstalled=true
          echo "NDK $version at $dir, on the runner image: $preinstalled"
          { echo "version=$version"; echo "dir=$dir"; echo "preinstalled=$preinstalled"; } >> "$GITHUB_OUTPUT"
      - name: Cache the pinned NDK
        if: steps.ndk.outputs.preinstalled != 'true'
        id: ndk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.ndk.outputs.dir }}
          key: ndk-${{ runner.os }}-${{ steps.ndk.outputs.version }}
      - name: Install the pinned NDK and check its revision
        env:
          NDK_VERSION: ${{ steps.ndk.outputs.version }}
          NDK_DIR: ${{ steps.ndk.outputs.dir }}
        run: |
          set -eu
          if [ ! -f "$NDK_DIR/source.properties" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          fi
          revision=$(sed -n 's/^Pkg\.Revision *= *//p' "$NDK_DIR/source.properties" | tr -d ' \r')
          echo "NDK used: $revision ($NDK_DIR)"
          test "$revision" = "$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
      - name: Install the pinned toolchain
        working-directory: native
        run: rustup toolchain install
      - name: Cache the cargo registry and the Android build
        # The key changes only with the toolchain or Cargo.lock, so a Kotlin-only change restores the
        # same target folder; cargo then rebuilds only the workspace crates whose sources changed.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            native/target
          key: engine-apk-cargo-${{ runner.os }}-ndk-${{ steps.ndk.outputs.version }}-${{ hashFiles('native/rust-toolchain.toml', 'native/Cargo.lock') }}
          restore-keys: |
            engine-apk-cargo-${{ runner.os }}-ndk-${{ steps.ndk.outputs.version }}-
      - name: Cache cargo-ndk
        id: cargo-ndk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-${{ env.CARGO_NDK_VERSION }}
      - name: Install cargo-ndk
        if: steps.cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked --version "$CARGO_NDK_VERSION"
      - name: Read the OCR model pin
        id: model
        run: |
          set -eu
          pin=native/ocr-model/model.properties
          file=$(sed -n 's/^file=//p' "$pin")
          sha256=$(sed -n 's/^sha256=//p' "$pin")
          url=$(sed -n 's/^url=//p' "$pin")
          echo "$sha256" | grep -Eq '^[0-9a-f]{64}$'
          { echo "file=$file"; echo "sha256=$sha256"; echo "url=$url"; } >> "$GITHUB_OUTPUT"
      - name: Cache the OCR model by its SHA-256
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/fga-ocr-model
          key: ocr-model-${{ steps.model.outputs.sha256 }}
      - name: Download the model on a cache miss and check it either way
        env:
          MODEL_FILE: ${{ steps.model.outputs.file }}
          MODEL_SHA256: ${{ steps.model.outputs.sha256 }}
          MODEL_URL: ${{ steps.model.outputs.url }}
        run: |
          set -eu
          dir="$HOME/fga-ocr-model"
          mkdir -p "$dir"
          if [ ! -f "$dir/$MODEL_FILE" ]; then
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 3 --retry-all-errors \
              --output "$dir/$MODEL_FILE.part" "$MODEL_URL"
            mv "$dir/$MODEL_FILE.part" "$dir/$MODEL_FILE"
          fi
          echo "$MODEL_SHA256  $dir/$MODEL_FILE" | sha256sum --check
      - name: Build the beta APK with the engine
        # checkRustKeepRulesBeta and checkEngineApkBeta are part of assembleBeta; ANDROID_NDK_HOME is
        # the pinned NDK from the step above.
        env:
          MODEL_FILE: ${{ steps.model.outputs.file }}
        run: ./gradlew :app:assembleBeta -PfgaDebugSigning=true "-Pfga.ocr.model=$HOME/fga-ocr-model/$MODEL_FILE"
      - name: The APK carries the engine
        run: |
          set -eu
          set -- app/build/outputs/apk/beta/*.apk
          [ -e "$1" ] || { echo "No beta APK under app/build/outputs/apk/beta"; exit 1; }
          python3 tools/ci/apk_check.py present "$@"
      - name: 16 KB alignment inside the APK, with the SDK's own tools
        run: |
          set -eu
          apk=$(ls app/build/outputs/apk/beta/*.apk)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # An assignment, not a pipe, so that a failed verification fails the step.
          report=$("$tools/zipalign" -c -P 16 -v 4 "$apk")
          echo "$report" | grep -E 'lib/.*/libfga_ffi\.so|Verification'
          unzip -o -q "$apk" lib/arm64-v8a/libfga_ffi.so -d "$RUNNER_TEMP/apk"
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          aligns=$("$readelf" -lW "$RUNNER_TEMP/apk/lib/arm64-v8a/libfga_ffi.so" | awk '$1 == "LOAD" { print $NF }' | sort -u)
          echo "LOAD alignment in the APK: $aligns"
          test "$aligns" = "0x4000"
      - name: The keep rules held
        run: grep -F 'io.github.fate_grand_automata.sensing.RustSensing' app/build/outputs/mapping/beta/seeds.txt
