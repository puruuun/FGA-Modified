name: Publish manual site

# Builds the user manual (mkdocs.yml, pages from wiki/) and deploys it to GitHub Pages.
# One-time setup by the repository owner: Settings → Pages → Source = "GitHub Actions".
# Owner decision 2026-10-29: the manual follows stable releases only. Beta work on main is not published.
#   - A published non-prerelease GitHub Release dispatches this workflow on main with that tag.
#   - A manual run builds the given tag, or the latest stable tag (vX.Y.Z) when none is given.
# The deploy job always runs on refs/heads/main, which the github-pages environment allows.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable tag to publish (empty = latest vX.Y.Z)'
        required: false
        default: ''

concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dispatch:
    # The release event runs on the tag ref, which the environment rejects; re-run on main instead.
    if: github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the manual build on main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out the stable tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          fi
          echo "Publishing the manual from $TAG"
          git checkout --detach "$TAG"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: pip install -r tools/docs-site/requirements.txt

      - name: Build
        run: mkdocs build --strict

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
