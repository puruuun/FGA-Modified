name: Beta APK

on:
  push:
    branches: [beta/servant-portraits]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

env:
  FGA_VERSION_NAME: 1.0.2-beta.4
  FGA_VERSION_CODE: 1000204
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC"'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Run unit tests
        run: ./gradlew :app:testCiUnitTest :prefs:testCiUnitTest :scripts:test :libautomata:test
      - name: Build beta APK
        run: ./gradlew :app:assembleBeta
      - name: Name APK
        run: cp app/build/outputs/apk/beta/app-beta.apk FGA-beta-${FGA_VERSION_NAME}-arm.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: FGA-beta-apk
          path: FGA-beta-*-arm.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: beta-test-reports
          path: '**/build/test-results/**/*.xml'
