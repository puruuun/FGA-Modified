name: "버그 제보 / バグ報告 / Bug report"
description: "앱이 잘못 동작하거나 멈출 때 · アプリが正しく動かないとき · The app does something wrong or stops"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        한국어, 日本語, English 중 편한 언어로 적어 주세요. 모든 칸은 선택 사항이고, 더 필요한 내용은 답글로 여쭙겠습니다.
        書きやすい言語でどうぞ。すべての項目は任意です。足りない情報はコメントでお聞きします。
        Write in any of these languages. Every field is optional; the maintainer will ask in a comment for what is missing.

        **공개 저장소입니다.** 스크린샷에 프렌드 코드, 닉네임 같은 계정 정보가 보이면 가린 뒤 올려 주세요.
        **公開リポジトリです。** フレンドコードやマスター名などのアカウント情報は隠してから投稿してください。
        **This repository is public.** Hide account data such as a friend code or a player name before you post a screenshot.
  - type: textarea
    id: what
    attributes:
      label: "무슨 일이 있었나요? / 何が起きましたか？ / What happened?"
      description: "기대한 동작과 실제 동작 · 期待した動作と実際の動作 · What you expected and what the app did instead"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: "어떻게 하면 다시 일어나나요? / 再現手順 / How can it be reproduced?"
      description: "기능(전투, 스킬 강화, 로그 수집 등)과 순서 · 機能と手順 · The feature (battle, skill upgrade, log capture, ...) and the steps"
    validations:
      required: false
  - type: dropdown
    id: server
    attributes:
      label: "게임 서버 / ゲームサーバー / Game server"
      options:
        - "한국 / 韓国 / KR"
        - "일본 / 日本 / JP"
        - "그 외 / その他 / Other"
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: "앱 버전 / アプリのバージョン / App version"
      description: "앱 첫 화면의 Build: 옆에 표시됩니다 · 最初の画面の Build: の横に表示されます · Shown next to Build: on the first screen"
      placeholder: "1.8.1"
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: "기기와 안드로이드 버전 / 端末と Android のバージョン / Device and Android version"
      placeholder: "Galaxy Tab S9, Android 14 / BlueStacks 5, Android 11"
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: "스크린샷, 설정, 그 밖의 정보 / スクリーンショット、設定など / Screenshots, settings, anything else"
      description: "화면 해상도, 관련 설정, 스크린샷 · 画面解像度、関連する設定、スクリーンショット · Screen resolution, related settings, screenshots"
    validations:
      required: false
