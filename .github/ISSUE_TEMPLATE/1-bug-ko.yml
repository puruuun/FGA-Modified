name: "버그 제보 (한국어)"
description: "앱이 잘못 동작하거나 멈출 때"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        아는 만큼만 적어 주세요. 비워 둔 칸이 있어도 제보할 수 있고, 더 필요한 내용은 답글로 여쭙겠습니다.

        **올리기 전에 확인해 주세요.** 이 저장소는 공개되어 있습니다. 스크린샷에 프렌드 코드, 닉네임 같은 계정 정보가 보이면 가린 뒤 올려 주세요.
  - type: textarea
    id: what
    attributes:
      label: "무슨 일이 있었나요?"
      description: "기대한 동작과 실제 동작을 적어 주세요."
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: "어떻게 하면 다시 일어나나요?"
      description: "기능(전투, 스킬 강화, 로그 수집 등)과 순서를 적어 주세요."
    validations:
      required: false
  - type: dropdown
    id: server
    attributes:
      label: "게임 서버"
      options:
        - "한국"
        - "일본"
        - "그 외"
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: "앱 버전"
      description: "앱 첫 화면의 Build: 옆에 표시됩니다."
      placeholder: "예: 1.8.1"
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: "기기와 안드로이드 버전"
      placeholder: "예: Galaxy Tab S9, Android 14 / BlueStacks 5, Android 11"
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: "스크린샷, 설정, 그 밖의 정보"
      description: "화면 해상도, 관련 설정, 스크린샷을 붙여 주시면 도움이 됩니다."
    validations:
      required: false
